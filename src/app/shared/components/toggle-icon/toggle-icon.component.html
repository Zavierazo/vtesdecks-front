<div class="btn-group" role="group">
  @for(option of options(); track option) {
  <button type="button" class="btn" [ngClass]="{
    'btn-primary': option.option === active(),
    'btn-outline-primary': option.option !== active()
  }" (click)="onToggle(option)" [title]="option.label | transloco"
    [attr.aria-label]="option.label | transloco">
    <i class="bi bi-{{ option.icon }}"></i>
    <span class="d-none d-sm-inline ms-1">{{ option.label | transloco}}</span>
  </button>
  }
</div>
