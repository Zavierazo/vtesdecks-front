<div class="w-100 mt-3 text-center ad-sense-container" *appIsSupporter="false">
  <ins
    class="adsbygoogle"
    style="display: block"
    [attr.data-ad-client]="adClient"
    [attr.data-ad-slot]="adSlot"
    [attr.data-ad-format]="adFormat"
    [attr.data-full-width-responsive]="fullWidthResponsive"
  ></ins>
  <div *adSense></div>
  <small class="ad-free-patreon-message mt-1 text-body-secondary">
    <a
      href="https://www.patreon.com/join/vtesdecks"
      target="_blank"
      rel="noopener noreferrer"
      class="text-reset"
    >
      {{ 'shared.ad_free_patreon' | transloco }}
    </a>
  </small>
</div>
