<div ngbDropdown autoClose="outside" class="form-floating multi-select">
  <button
    type="button"
    class="form-select text-start"
    [id]="controlId()"
    [attr.aria-label]="ariaLabel()"
    ngbDropdownToggle
  >
    {{ summary() || placeholder() }}
  </button>
  <label [for]="controlId()">{{ label() }}</label>
  <div
    ngbDropdownMenu
    class="multi-select-menu w-100 py-1"
    [attr.aria-labelledby]="controlId()"
  >
    @for (option of options(); track option.value) {
      <button
        type="button"
        class="dropdown-item d-flex align-items-center"
        role="checkbox"
        [attr.aria-checked]="ariaState(option.value)"
        (click)="toggle(option.value)"
      >
        <span
          class="multi-select-checkbox"
          [class.is-checked]="state(option.value) === 'checked'"
          [class.is-excluded]="state(option.value) === 'excluded'"
          aria-hidden="true"
        >
          @if (state(option.value) === 'checked') {
            ✓
          } @else if (state(option.value) === 'excluded') {
            !
          }
        </span>
        <span>{{ option.label }}</span>
      </button>
    }
  </div>
</div>
