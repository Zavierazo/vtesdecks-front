@if (imageUrl(); as url) {
  <div class="art-crop" [style.aspect-ratio]="crop.width + ' / ' + crop.height">
    <img
      #image
      [src]="url"
      alt=""
      draggable="false"
      [style.visibility]="imageWidth() ? 'visible' : 'hidden'"
      [style.width.%]="(imageWidth() * 100) / crop.width"
      [style.left.%]="(-crop.x * 100) / crop.width"
      [style.top.%]="(-crop.y * 100) / crop.height"
      (load)="onLoad(image)"
      (error)="onError()"
    />
  </div>
}
