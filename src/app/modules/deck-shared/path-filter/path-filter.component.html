@if (allowExclude) {
  <div
    class="d-flex flex-wrap align-items-center gap-2 mb-1 w-100 mode-controls"
  >
    <small class="text-body-secondary filter-hint">
      <i class="bi bi-slash-circle"></i>
      {{
        (isMobileOrTablet
          ? 'shared.filter_exclude_hint_mobile'
          : 'shared.filter_exclude_hint_desktop'
        ) | transloco
      }}
    </small>
  </div>
}
@if (showNotRequired) {
  <span
    role="button"
    tabindex="0"
    (click)="toggleNotRequired()"
    (keydown.enter)="toggleNotRequired()"
    (keydown.space)="toggleNotRequired(); $event.preventDefault()"
    appExcludeGesture
    (excludeGesture)="onExcludeGesture('none')"
    [title]="'shared.not_required' | transloco"
    [ngClass]="{ excluded: isExcluded('none') }"
  >
    <i
      class="btn-icon vtes vtes-big noclan"
      [ngClass]="{
        'non-selected': !isSelected('none') && !isExcluded('none'),
      }"
    ></i>
  </span>
}
@for (path of pathsList; track path) {
  <span
    role="button"
    tabindex="0"
    (click)="toggle(path.name)"
    (keydown.enter)="toggle(path.name)"
    (keydown.space)="toggle(path.name); $event.preventDefault()"
    appExcludeGesture
    (excludeGesture)="onExcludeGesture(path.name)"
    [title]="path.label | transloco"
    [ngClass]="{ excluded: isExcluded(path.name) }"
  >
    <i
      class="btn-icon vtes vtes-big path me-1"
      [class]="path.icon"
      [ngClass]="{
        'non-selected': !isSelected(path.name) && !isExcluded(path.name),
        'bg-dark': isSelected(path.name),
      }"
    ></i>
  </span>
}
