<ng-container *transloco="let t; prefix: 'shared'">
  @if (isMobileOrTablet$ | async) {
  <div class="d-inline-flex gap-2 mb-2">
    <button type="button" class="btn" [class.btn-outline-secondary]="!active()" [class.btn-primary]="active()"
      (click)="openFilters(filterModal)">
      <i class="bi bi-funnel-fill"></i>
      {{ t('card_filters') }}
    </button>
    @if (active()) {
    <button type="button" class="btn btn-outline-secondary" (click)="reset()">
      <i class="bi bi-x-circle"></i>
      {{ t('reset') }}
    </button>
    }
  </div>
  } @else {
  <div class="filters-desktop">
    <div class="filters-desktop-container">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <strong class="text-primary">
          <i class="bi bi-funnel-fill"></i> {{ t('card_filters') }}
        </strong>
        @if (active()) {
        <button type="button" class="btn btn-sm btn-outline-secondary" (click)="reset()">
          <i class="bi bi-x-circle"></i>
          {{ t('reset') }}
        </button>
        }
      </div>
      <ng-container *ngTemplateOutlet="panel" />
    </div>
  </div>
  }

  <ng-template #filterModal let-modal>
    <div class="modal-header">
      <h4 class="modal-title">
        <i class="bi bi-funnel-fill"></i> {{ t('card_filters') }}
      </h4>
      <button type="button" class="btn-close" [attr.aria-label]="t('close')" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
      <ng-container *ngTemplateOutlet="panel" />
    </div>
    <div class="modal-footer">
      <div class="d-grid gap-2 w-100">
        <button type="button" class="btn btn-outline-danger" (click)="reset()">
          {{ t('reset') }}
        </button>
        <button type="button" class="btn btn-primary" (click)="modal.close()">
          {{ t('apply') }}
        </button>
      </div>
    </div>
  </ng-template>

  <ng-template #panel>
    @if (cardType() === 'crypt' && cryptFilter) {
    <app-crypt-builder-filter [filter]="cryptFilter" [showSet]="false" (filterChange)="onFilterChange()" />
    } @else if (cardType() === 'library' && libraryFilter) {
    <app-library-builder-filter [filter]="libraryFilter" [showSet]="false" (filterChange)="onFilterChange()" />
    }
  </ng-template>
</ng-container>
