<ng-container *transloco="let t; prefix: 'import_amaranth'">
  <div class="modal-header">
    <h4 class="modal-title">{{ t('title') }}</h4>
    <button type="button" class="btn-close" [attr.aria-label]="'shared.close' | transloco"
      (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body text-center">
    <form [formGroup]="form">
      <div class="form-floating text-start">
        <input type="text" class="form-control rounded-3" id="name" placeholder="url" formControlName="url">
        <label for="url">{{ t('placeholder') }}</label>
      </div>
    </form>

    @if (loading()) {
    <div class="d-flex justify-content-center mt-3">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    }

    @if (errorKey(); as key) {
    <div class="alert alert-danger mt-3 mb-0">{{ key | transloco }}</div>
    }
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger" [disabled]="loading()" (click)="modal.dismiss()">
      {{ 'shared.cancel' | transloco }}
    </button>
    <button type="button" ngbAutofocus class="btn btn-success text-white" [disabled]="loading() || form.invalid"
      (click)="import()">
      {{ 'shared.import' | transloco }}
    </button>
  </div>
</ng-container>
